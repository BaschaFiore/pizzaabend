<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>🍕 Pizza Session 🍕</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box; 
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3ee;
      color: #222;
    }


    .container {
      max-width: 550px;
      margin: auto;
      padding: 30px 20px;
    }


    h1 {
      text-align: center;
      font-size: 40px;
      margin-bottom: 10px;
    }


    h2 {
      margin-top: 30px;
    }


    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }


    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #e85d04;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }


    button:hover {
      background: #d94f00;
    }


    .ingredient {
      display: flex;
      align-items: center;
      padding: 12px;
      margin: 7px 0;
      background: white;
      border-radius: 10px;
      cursor: pointer;
    }


    .ingredient input {
      width: auto;
      margin: 0 12px 0 0;
    }


    .box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
    }


    .pizza {
      padding: 15px 0;
      border-bottom: 1px solid #ddd;
    }


    .code {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 4px;
    }


.signature {
  text-align: center;
  margin: 5px auto 25px;
}

.signature img {
  width: 260px;
  max-width: 80%;
  height: auto;
  mix-blend-mode: multiply;
}
    
    .hidden {
      display: none;
    }


    .success {
      text-align: center;
      font-size: 20px;
      padding: 20px;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>🍕 Pizzaabend</h1>

<div class="signature">
  <img
    src="./signature.png"
    alt="by Bascha Fiore"
  >
</div>


  <!-- =====================================================
       STARTSEITE
       ===================================================== -->

  <div id="start">

    <button onclick="showCreate()">
      Pizzaabend erstellen
    </button>


    <div class="box">

      <h2>Session beitreten</h2>

      <input
        id="joinCode"
        placeholder="Session-Code"
        maxlength="8"
      >

      <button onclick="joinSession()">
        Beitreten
      </button>

    </div>

  </div>


  <!-- =====================================================
       SESSION ERSTELLEN
       ===================================================== -->

  <div id="create" class="hidden">

    <h2>Pizzaabend erstellen</h2>


    <input
      id="sessionName"
      placeholder="Name des Pizzaabends"
    >


    <h2>Zutaten auswählen</h2>

    <div id="defaultIngredients"></div>


    <h2>Weitere Zutaten</h2>


    <!--
      Hier ist bereits ein erstes Feld vorhanden.
      Über den Button können beliebig viele weitere
      Zutaten hinzugefügt werden.
    -->

    <div id="customIngredients">

      <input
        type="text"
        class="customIngredient"
        placeholder="z.B. Gorgonzola 🧀"
      >

    </div>


    <button
      type="button"
      onclick="addCustomIngredientField()"
      style="background:#777;"
    >
      ➕ Weitere Zutat hinzufügen
    </button>


    <button onclick="createSession()">
      🍕 Pizzaabend erstellen
    </button>

  </div>


  <!-- =====================================================
       GASTGEBER
       ===================================================== -->

  <div id="host" class="hidden">

    <h2 id="hostTitle"></h2>


    <div class="box">

      <div>Session-Code:</div>

      <div
        class="code"
        id="hostCode"
      ></div>


      <button onclick="copyLink()">
        🔗 Link kopieren
      </button>

    </div>


    <h2>🍕 Pizzen</h2>

    <div id="pizzaList"></div>

  </div>


  <!-- =====================================================
       GAST
       ===================================================== -->

  <div id="guest" class="hidden">

    <h2 id="guestTitle"></h2>


    <div class="box">

      <label>Dein Name</label>


      <input
        id="guestName"
        placeholder="z.B. Max"
      >


      <h2>Deine Pizza</h2>


      <div id="guestIngredients"></div>


      <button onclick="addPizza()">
        🍕 Pizza hinzufügen
      </button>

    </div>


    <div id="guestSuccess"></div>

  </div>


</div>



<script>


// =====================================================
// SUPABASE
// =====================================================


const SUPABASE_URL =
  "https://lckxxinenuiqucvuminb.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_Z0E7ZD5LghBMt1eYFi2dEg_fh0hUGV9";


const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentSession = null;

let currentIngredients = [];



// =====================================================
// HILFSFUNKTION
// =====================================================


function show(id) {

document
  .querySelectorAll(".container > div:not(.signature)")
  .forEach(el =>
    el.classList.add("hidden")
  );


  document
    .getElementById(id)
    .classList.remove("hidden");

}



// =====================================================
// SESSION-CODE ERSTELLEN
// =====================================================


function generateCode() {

  return Math.random()
    .toString(36)
    .substring(2, 8)
    .toUpperCase();

}



// =====================================================
// EIGENE ZUTAT – NEUES FELD
// =====================================================


function addCustomIngredientField() {

  const container =
    document.getElementById(
      "customIngredients"
    );


  const input =
    document.createElement("input");


  input.type = "text";

  input.className =
    "customIngredient";

  input.placeholder =
    "z.B. Gorgonzola 🧀";


  container.appendChild(input);

}



// =====================================================
// SESSION ERSTELLEN – ZUTATEN LADEN
// =====================================================


async function showCreate() {

  show("create");


  // Vorhandene eigene Zutatenfelder zurücksetzen
  document.getElementById(
    "customIngredients"
  ).innerHTML = `
    <input
      type="text"
      class="customIngredient"
      placeholder="z.B. Gorgonzola 🧀"
    >
  `;


  const {
    data,
    error
  } = await db
    .from("ingredients")
    .select("*")
    .eq("is_default", true)
    .order("id");


  if (error) {

    alert(
      "Fehler beim Laden der Zutaten."
    );

    console.error(error);

    return;
  }


  currentIngredients = data;


  document.getElementById(
    "defaultIngredients"
  ).innerHTML =

    data.map(i => `

      <label class="ingredient">

        <input
          type="checkbox"
          value="${i.id}"
          checked
        >

        ${i.name} ${i.emoji}

      </label>

    `).join("");

}



// =====================================================
// SESSION ERSTELLEN
// =====================================================


async function createSession() {


  const name =
    document
      .getElementById("sessionName")
      .value
      .trim();


  if (!name) {

    alert(
      "Bitte gib einen Namen für den Pizzaabend ein."
    );

    return;
  }


  const code =
    generateCode();



  // ===================================================
  // SESSION ERSTELLEN
  // ===================================================


  const {
    data: session,
    error
  } = await db
    .from("Sessions")
    .insert({
      name: name,
      code: code
    })
    .select()
    .single();


  if (error) {

    alert(
      "Session konnte nicht erstellt werden."
    );

    console.error(error);

    return;
  }


  currentSession = session;



  // ===================================================
  // GASTGEBER-SESSION SPEICHERN
  // ===================================================


  localStorage.setItem(
    "pizzaabend_host",
    JSON.stringify({
      id: session.id,
      code: session.code
    })
  );



  // ===================================================
  // AUSGEWÄHLTE STANDARDZUTATEN
  // ===================================================


  const selectedIds = [

    ...document.querySelectorAll(
      "#defaultIngredients input:checked"
    )

  ].map(
    input => Number(input.value)
  );



  // ===================================================
  // STANDARDZUTATEN FÜR SESSION SPEICHERN
  // ===================================================


  if (selectedIds.length > 0) {


    const rows =
      selectedIds.map(
        ingredientId => ({
          session_id: session.id,
          ingredient_id: ingredientId
        })
      );


    const {
      error: sessionIngredientError
    } = await db
      .from("session_ingredients")
      .insert(rows);


    if (sessionIngredientError) {

      alert(
        "Die Zutaten konnten nicht gespeichert werden."
      );

      console.error(
        sessionIngredientError
      );

      return;
    }

  }



  // ===================================================
  // EIGENE ZUTATEN
  // ===================================================


  const customInputs =
    document.querySelectorAll(
      ".customIngredient"
    );


  for (const input of customInputs) {


    const custom =
      input.value.trim();


    // Leere Felder ignorieren

    if (!custom) {
      continue;
    }



    // =================================================
    // EMOJI ERKENNEN
    // =================================================


    const emojiMatch =
      custom.match(
        /(\p{Emoji_Presentation}|\p{Extended_Pictographic})$/u
      );


    let ingredientName =
      custom;

    let emoji = "";



    if (emojiMatch) {

      emoji =
        emojiMatch[0];


      ingredientName =
        custom
          .substring(
            0,
            custom.length - emoji.length
          )
          .trim();

    }



    // =================================================
    // EIGENE ZUTAT IN DATABASE SPEICHERN
    // =================================================


    const {
      data: newIngredient,
      error: ingredientError
    } = await db
      .from("ingredients")
      .insert({
        name: ingredientName,
        emoji: emoji,
        is_default: false,
        session_id: session.id
      })
      .select()
      .single();


    if (ingredientError) {

      alert(
        "Die zusätzliche Zutat konnte nicht gespeichert werden."
      );

      console.error(
        ingredientError
      );

      return;
    }



    // =================================================
    // EIGENE ZUTAT DER SESSION ZUORDNEN
    // =================================================


    const {
      error: sessionIngredientError
    } = await db
      .from("session_ingredients")
      .insert({
        session_id: session.id,
        ingredient_id: newIngredient.id
      });


    if (sessionIngredientError) {

      alert(
        "Die zusätzliche Zutat konnte der Session nicht zugeordnet werden."
      );

      console.error(
        sessionIngredientError
      );

      return;
    }

  }



  // ===================================================
  // GASTGEBER-ANSICHT
  // ===================================================


  document.getElementById(
    "hostTitle"
  ).textContent = name;


  document.getElementById(
    "hostCode"
  ).textContent = code;


  show("host");


  await loadHostIngredients();


  await loadPizzas();

}



// =====================================================
// ZUTATEN DER SESSION FÜR GASTGEBER LADEN
// =====================================================


async function loadHostIngredients() {


  const {
    data,
    error
  } = await db
    .from("session_ingredients")
    .select(`
      ingredient_id,
      ingredients (*)
    `)
    .eq(
      "session_id",
      currentSession.id
    );


  if (error) {

    console.error(error);

    return;
  }


  currentIngredients =
    (data || [])
      .map(
        row => row.ingredients
      )
      .filter(Boolean);

}



// =====================================================
// GASTGEBER NACH NEULADEN WIEDERHERSTELLEN
// =====================================================


async function restoreHostSession() {


  const saved =
    localStorage.getItem(
      "pizzaabend_host"
    );


  if (!saved) {
    return false;
  }


  try {


    const hostData =
      JSON.parse(saved);


    const {
      data: session,
      error
    } = await db
      .from("Sessions")
      .select("*")
      .eq("id", hostData.id)
      .eq("code", hostData.code)
      .single();


    if (error || !session) {

      localStorage.removeItem(
        "pizzaabend_host"
      );

      return false;
    }


    currentSession =
      session;


    document.getElementById(
      "hostTitle"
    ).textContent =
      session.name;


    document.getElementById(
      "hostCode"
    ).textContent =
      session.code;


    await loadHostIngredients();


    show("host");


    await loadPizzas();


    return true;


  } catch (error) {

    console.error(error);


    localStorage.removeItem(
      "pizzaabend_host"
    );


    return false;

  }

}



// =====================================================
// SESSION BEITRETEN
// =====================================================


async function joinSession() {


  const code =
    document
      .getElementById("joinCode")
      .value
      .trim()
      .toUpperCase();


  if (!code) {
    return;
  }


  const {
    data,
    error
  } = await db
    .from("Sessions")
    .select("*")
    .eq("code", code)
    .single();


  if (error || !data) {

    alert(
      "Session nicht gefunden."
    );

    return;
  }


  currentSession =
    data;


  document.getElementById(
    "guestTitle"
  ).textContent =
    data.name;



  // ===================================================
  // NUR ZUTATEN DIESER SESSION LADEN
  // ===================================================


  const {
    data: sessionIngredients,
    error: ingredientError
  } = await db
    .from("session_ingredients")
    .select(`
      ingredient_id,
      ingredients (*)
    `)
    .eq(
      "session_id",
      data.id
    );


  if (ingredientError) {

    alert(
      "Die Zutaten konnten nicht geladen werden."
    );

    console.error(
      ingredientError
    );

    return;
  }


  currentIngredients =
    (sessionIngredients || [])
      .map(
        row => row.ingredients
      )
      .filter(Boolean);



  // ===================================================
  // ZUTATEN FÜR GAST ANZEIGEN
  // ===================================================


  document.getElementById(
    "guestIngredients"
  ).innerHTML =

    currentIngredients
      .map(i => `

        <label class="ingredient">

          <input
            type="checkbox"
            value="${i.id}"
          >

          ${i.name} ${i.emoji}

        </label>

      `)
      .join("");


  show("guest");

}



// =====================================================
// PIZZA HINZUFÜGEN
// =====================================================


async function addPizza() {


  const guestName =
    document
      .getElementById("guestName")
      .value
      .trim();


  if (!guestName) {

    alert(
      "Bitte gib deinen Namen ein."
    );

    return;
  }



  // ===================================================
  // MEHRERE ZUTATEN AUSWÄHLEN
  // ===================================================


  const selectedIds = [

    ...document.querySelectorAll(
      "#guestIngredients input:checked"
    )

  ].map(
    input => Number(input.value)
  );



  // ===================================================
  // PIZZA SPEICHERN
  // ===================================================


  const {
    data: pizza,
    error
  } = await db
    .from("pizzas")
    .insert({
      session_id: currentSession.id,
      guest_name: guestName
    })
    .select()
    .single();


  if (error) {

    alert(
      "Pizza konnte nicht gespeichert werden."
    );

    console.error(error);

    return;
  }



  // ===================================================
  // MEHRERE ZUTATEN SPEICHERN
  // ===================================================


  if (selectedIds.length > 0) {


    const rows =
      selectedIds.map(
        id => ({
          pizza_id: pizza.id,
          ingredient_id: id
        })
      );


    const {
      error: ingredientError
    } = await db
      .from("pizza_ingredients")
      .insert(rows);


    if (ingredientError) {

      console.error(
        ingredientError
      );

      alert(
        "Die Pizza wurde gespeichert, aber die Zutaten konnten nicht gespeichert werden."
      );

    }

  }



  // ===================================================
  // ERFOLG ANZEIGEN
  // ===================================================


  document.getElementById(
    "guestSuccess"
  ).innerHTML = `

    <div class="success">

      ✅ Pizza hinzugefügt!

      <br><br>

      Du kannst direkt eine weitere Pizza auswählen.

    </div>

  `;



  // ===================================================
  // HÄKCHEN ENTFERNEN
  // ===================================================


  document
    .querySelectorAll(
      "#guestIngredients input"
    )
    .forEach(
      input =>
        input.checked = false
    );

}



// =====================================================
// PIZZEN FÜR GASTGEBER LADEN
// =====================================================


async function loadPizzas() {


  const {
    data: pizzas,
    error
  } = await db
    .from("pizzas")
    .select("*")
    .eq(
      "session_id",
      currentSession.id
    )
    .order("created_at");


  if (error) {

    console.error(error);

    return;
  }


  let html = "";



  for (const pizza of pizzas || []) {


    const {
      data: links
    } = await db
      .from("pizza_ingredients")
      .select("ingredient_id")
      .eq(
        "pizza_id",
        pizza.id
      );


    const ids =
      (links || [])
        .map(
          x => x.ingredient_id
        );


    const ingredients =
      currentIngredients
        .filter(
          i => ids.includes(i.id)
        );


    html += `

      <div class="pizza">

        <strong>
          ${pizza.guest_name}
        </strong>

        <br>

        ${
          ingredients.length

            ? ingredients
                .map(
                  i =>
                    `${i.name} ${i.emoji}`
                )
                .join(" · ")

            : "Margherita"
        }

      </div>

    `;

  }



  document.getElementById(
    "pizzaList"
  ).innerHTML =

    html ||
    "Noch keine Pizzen bestellt.";

}



// =====================================================
// LINK KOPIEREN
// =====================================================


function copyLink() {


  const url =

    window.location.origin +

    window.location.pathname +

    "?session=" +

    currentSession.code;


  navigator.clipboard.writeText(url);


  alert(
    "Link kopiert! Du kannst ihn jetzt verschicken."
  );

}



// =====================================================
// START
// =====================================================


async function initialize() {


  const params =
    new URLSearchParams(
      window.location.search
    );


  const urlSession =
    params.get("session");



  // ===================================================
  // LINK MIT ?session=...
  // IMMER ALS GAST ÖFFNEN
  // ===================================================


  if (urlSession) {


    document.getElementById(
      "joinCode"
    ).value =
      urlSession;


    await joinSession();


    return;
  }



  // ===================================================
  // GASTGEBER WIEDERHERSTELLEN
  // ===================================================


  const restored =
    await restoreHostSession();


  if (!restored) {

    show("start");

  }

}



// =====================================================
// PIZZEN ALLE 5 SEKUNDEN AKTUALISIEREN
// =====================================================


setInterval(() => {


  if (

    currentSession &&

    !document
      .getElementById("host")
      .classList
      .contains("hidden")

  ) {

    loadPizzas();

  }


}, 5000);



// =====================================================
// START
// =====================================================


initialize();


</script>


</body>

</html>
